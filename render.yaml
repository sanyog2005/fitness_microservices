# ========================================================
# 🚀 Render Blueprint (Infrastructure-as-Code)
# Deploys all 4 Microservices & API Gateway on Render Free Tier
# Repository: https://github.com/sanyog2005/fitness_microservices
# ========================================================

services:
  # ------------------------------------------------------
  # 1. Auth & User Microservice
  # ------------------------------------------------------
  - type: web
    name: fitness-auth-service
    runtime: node
    plan: free
    rootDir: auth-service
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        value: mongodb+srv://sanyogsharma073_db_user:sEDm6AAsAjH1HoyE@cluster0.k2enetx.mongodb.net/?retryWrites=true&w=majority
      - key: MONGO_DB
        value: fitness_auth
      - key: JWT_SECRET
        value: 8f9a2c4e7b1d5f6h8j0k2l4m6n8p0q2r4s6t8u0v2w4x6y8z
      - key: ADMIN_CRED_FORGOT
        value: "9560231025"

  # ------------------------------------------------------
  # 2. Event & Pass Microservice
  # ------------------------------------------------------
  - type: web
    name: fitness-event-service
    runtime: node
    plan: free
    rootDir: event-service
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        value: mongodb+srv://sanyogsharma073_db_user:sEDm6AAsAjH1HoyE@cluster0.k2enetx.mongodb.net/?retryWrites=true&w=majority
      - key: MONGO_DB
        value: fitness_events
      - key: JWT_SECRET
        value: 8f9a2c4e7b1d5f6h8j0k2l4m6n8p0q2r4s6t8u0v2w4x6y8z

  # ------------------------------------------------------
  # 3. Booking & Catalog Microservice
  # ------------------------------------------------------
  - type: web
    name: fitness-booking-service
    runtime: node
    plan: free
    rootDir: booking-service
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        value: mongodb+srv://sanyogsharma073_db_user:sEDm6AAsAjH1HoyE@cluster0.k2enetx.mongodb.net/?retryWrites=true&w=majority
      - key: MONGO_DB
        value: fitness_bookings
      - key: JWT_SECRET
        value: 8f9a2c4e7b1d5f6h8j0k2l4m6n8p0q2r4s6t8u0v2w4x6y8z

  # ------------------------------------------------------
  # 4. Payment & Order Microservice
  # ------------------------------------------------------
  - type: web
    name: fitness-payment-service
    runtime: node
    plan: free
    rootDir: payment-service
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        value: mongodb+srv://sanyogsharma073_db_user:sEDm6AAsAjH1HoyE@cluster0.k2enetx.mongodb.net/?retryWrites=true&w=majority
      - key: MONGO_DB
        value: fitness_payments
      - key: JWT_SECRET
        value: 8f9a2c4e7b1d5f6h8j0k2l4m6n8p0q2r4s6t8u0v2w4x6y8z
      - key: RAZORPAY_KEY_ID
        value: rzp_live_TK9nFyuQyb3RqO
      - key: RAZORPAY_KEY_SECRET
        value: z7vfhLgoStIHCq2OAbmfOWt1

  # ------------------------------------------------------
  # 5. API Gateway (Reverse Proxy Entrypoint)
  # ------------------------------------------------------
  - type: web
    name: fitness-api-gateway
    runtime: docker
    plan: free
    dockerContext: api-gateway
    dockerfilePath: api-gateway/Dockerfile
    healthCheckPath: /api/ping
    envVars:
      - key: AUTH_SERVICE_URL
        fromService:
          type: web
          name: fitness-auth-service
          property: host
      - key: EVENT_SERVICE_URL
        fromService:
          type: web
          name: fitness-event-service
          property: host
      - key: BOOKING_SERVICE_URL
        fromService:
          type: web
          name: fitness-booking-service
          property: host
      - key: PAYMENT_SERVICE_URL
        fromService:
          type: web
          name: fitness-payment-service
          property: host
